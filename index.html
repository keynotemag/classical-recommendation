:root{--black:#111111;--orange:#F26A21;--paper:#FAF9F6;--white:#fff;--gray:#666;--line:#E5E1DB}

.cta{border:0;background:var(--black);color:#fff;border-radius:999px;padding:16px 20px;font-size:14px;font-weight:800;cursor:pointer;width:100%;margin-top:28px}

.answers{display:grid;gap:10px} .answer{border:1px solid var(--line);background:#fff;border-radius:13px;padding:18px;text-align:left;font-size:14px;line-height:1.5;cursor:pointer}

function axis(idxs,a,b){
 let score=idxs.reduce((s,i)=>s+(answers[i]===0?1:-1),0);

 return score>0?a:b;
}
function mbti(){
 return axis([0,1,2,3],"E","I")+axis([4,5,6,7],"S","N")+axis([8,9,10,11],"T","F")+axis([12,13,14,15],"J","P");
}

function calculateMusicDNA(){
 const e=answers.slice(0,4).filter(v=>v===0).length/4;
 const i=1-e;
 const s=answers.slice(4,8).filter(v=>v===0).length/4;
 const n=1-s;
 const t=answers.slice(8,12).filter(v=>v===0).length/4;
 const f=1-t;
 const j=answers.slice(12,16).filter(v=>v===0).length/4;
 const p=1-j;
 return [
   Math.round(50+f*30+n*20),
   Math.round(50+n*35+p*15),
   Math.round(50+e*15+p*35),
   Math.round(50+i*30+t*20)
 ];
}
